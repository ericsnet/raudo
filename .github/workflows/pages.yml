name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "docs/media/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site
        run: |
          set -euo pipefail
          test -f site/index.html || { echo "::error::falta site/index.html"; exit 1; }
          test -f docs/media/raudo-launch.mp4 || { echo "::error::falta docs/media/raudo-launch.mp4 (el reproductor quedaría roto)"; exit 1; }
          rm -rf _site
          cp -r site _site
          mkdir -p _site/media
          cp docs/media/raudo-launch.mp4 _site/media/
          echo "Elementos publicados:" && find _site -type f -printf '  %p (%s bytes)\n'

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
